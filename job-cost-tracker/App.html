<script>
(function () {
'use strict';

/* =====================================================================
   1. Utilities
   ===================================================================== */
var ICONS = {
  grid: '<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',
  folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.4 3.2-5.5 6.5-5.5s5.9 2.1 6.5 5.5"/><path d="M16 4.8a3.5 3.5 0 0 1 0 6.4M18.5 14.8c1.6.9 2.7 2.6 3 5.2"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  chev: '<path d="M9 6l6 6-6 6"/>',
  back: '<path d="M15 6l-6 6 6 6"/>',
  search: '<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  alert: '<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17.5v.01"/>',
  download: '<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',
  edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  ruler: '<path d="M4 20V9.5L12 4l8 5.5V20z"/><path d="M9.5 20v-6h5v6"/>'
};
function icon(name) { return '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[name] || '') + '</svg>'; }
function $(sel, root) { return (root || document).querySelector(sel); }
function $all(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
function esc(s) {
  return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function round2(n) { return Math.round(n * 100) / 100; }
function sum(arr, f) { var t = 0; for (var i = 0; i < arr.length; i++) t += f(arr[i]); return round2(t); }
function num(n, dec) {
  return Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}
function money(n) { n = Math.round(n || 0); return (n < 0 ? '−' : '') + '$' + num(n, 0); }
function money2(n) { n = round2(n || 0); return (n < 0 ? '−' : '') + '$' + num(n, 2); }
function moneyShort(n) {
  if (n >= 1e6) return '$' + (n / 1e6).toFixed(n % 1e6 ? 1 : 0) + 'M';
  if (n >= 1000) return '$' + Math.round(n / 1000) + 'k';
  return '$' + Math.round(n);
}
function pct(x) { return Math.round((x || 0) * 100) + '%'; }
function pct1(x) { return ((x || 0) * 100).toFixed(1) + '%'; }
/** Variance in words: positive is under budget. */
function varText(v) {
  if (Math.abs(v) < 0.005) return '<span class="zero">—</span>';
  return v < 0 ? '<span class="var-over">' + money(-v) + ' over</span>'
    : '<span class="var-under">' + money(v) + ' under</span>';
}
function parseAmount(s) {
  s = String(s === null || s === undefined ? '' : s).trim();
  if (!s) return NaN;
  var neg = /^\(.*\)$/.test(s) || /^[-−]/.test(s);
  var n = Number(s.replace(/[^0-9.]/g, ''));
  if (!/[0-9]/.test(s) || !isFinite(n)) return NaN;
  return round2(neg ? -n : n);
}
var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function fmtDate(d) {
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d || '');
  return m ? MONTHS[+m[2] - 1] + ' ' + (+m[3]) + ', ' + m[1] : (d || '');
}
function isDate(d) { return /^\d{4}-\d{2}-\d{2}$/.test(d || '') && !isNaN(new Date(d + 'T00:00:00').getTime()); }
function daysBetween(a, b) { return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 864e5); }
function by(key) { return function (a, b) { return a[key] < b[key] ? -1 : a[key] > b[key] ? 1 : 0; }; }

/* =====================================================================
   2. State, server calls, saving
   ===================================================================== */
var S = {
  data: null,
  rev: 0,
  route: { view: 'overview' },
  panel: null,
  dialog: null,
  ui: { hideEmpty: {}, collapsed: {}, ledger: { q: '', cat: '', vendor: '', from: '', to: '', sort: 'date', dir: -1 },
    projType: '', showArchived: false, vendorQ: '', tplType: 'Residential', focusCat: null }
};
var TABLE_KEY = { Projects: 'projects', Templates: 'templates', LineItems: 'lineItems', Costs: 'costs',
  ChangeOrders: 'changeOrders', Vendors: 'vendors' };

function server(fn, args) {
  return new Promise(function (resolve, reject) {
    var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
    r[fn].apply(r, args || []);
  });
}
function errText(e) { return (e && e.message ? e.message : String(e)).replace(/^Error:\s*/, ''); }

function setData(json) {
  S.data = JSON.parse(json);
  S.rev++;
}
function reload() {
  return server('apiLoad').then(function (json) { setData(json); render(); });
}

function applyLocal(ops) {
  ops.forEach(function (op) {
    var list = S.data[TABLE_KEY[op.tab]];
    if (op.op === 'remove') {
      for (var i = list.length - 1; i >= 0; i--) if (list[i].id === op.id) list.splice(i, 1);
      return;
    }
    var found = null;
    for (var j = 0; j < list.length; j++) if (list[j].id === op.obj.id) { found = j; break; }
    if (op.tab === 'Costs' && op.obj.deleted) {
      if (found !== null) list.splice(found, 1);
    } else if (found !== null) {
      for (var k in op.obj) list[found][k] = op.obj[k];
    } else {
      list.push(JSON.parse(JSON.stringify(op.obj)));
    }
  });
  S.rev++;
}

var saveQueue = Promise.resolve();
/** Applies changes on screen at once, then saves them. A failed save reloads the true state. */
function mutate(ops, message, undoOps) {
  applyLocal(ops);
  render();
  if (message) toast(message, undoOps ? function () { mutate(undoOps, 'Undone'); } : null);
  saveQueue = saveQueue.then(function () { return server('apiOps', [ops]); }).then(null, function (e) {
    toast('That change could not be saved: ' + errText(e));
    return reload().then(null, function () {});
  });
  return saveQueue;
}
function up(tab, obj) { return { op: 'upsert', tab: tab, obj: obj }; }

function toast(text, undo) {
  var el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = '<span>' + esc(text) + '</span>' + (undo ? '<button type="button">Undo</button>' : '');
  if (undo) el.querySelector('button').onclick = function () { el.remove(); undo(); };
  $('#toasts').appendChild(el);
  setTimeout(function () { el.remove(); }, undo ? 7000 : 3500);
}

/* ---------- lookups ---------- */
function byId(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }
function project(id) { return byId(S.data.projects, id); }
function vendor(id) { return byId(S.data.vendors, id); }
function vendorName(id) { var v = vendor(id); return v ? v.name : 'Unknown vendor'; }
function lineItem(id) { return byId(S.data.lineItems, id); }
function templateTypes() {
  var t = { Residential: 0, Commercial: 0 };
  S.data.templates.forEach(function (r) { if (r.active) t[r.type] = (t[r.type] || 0) + 1; });
  return t;
}
function activeProjects() {
  return S.data.projects.filter(function (p) { return !p.archived && p.status !== 'Closed'; });
}

/* =====================================================================
   3. Calculations (spec section 3)
   ===================================================================== */
var cache = { rev: -1 };
function index() {
  if (cache.rev === S.rev) return cache;
  cache = { rev: S.rev, costsByLine: {}, linesByProject: {}, cosByProject: {}, calc: {} };
  S.data.costs.forEach(function (c) { (cache.costsByLine[c.lineItemId] = cache.costsByLine[c.lineItemId] || []).push(c); });
  S.data.lineItems.forEach(function (l) { (cache.linesByProject[l.projectId] = cache.linesByProject[l.projectId] || []).push(l); });
  S.data.changeOrders.forEach(function (o) { (cache.cosByProject[o.projectId] = cache.cosByProject[o.projectId] || []).push(o); });
  return cache;
}

function calc(pid) {
  var ix = index();
  if (ix.calc[pid]) return ix.calc[pid];
  var p = project(pid);
  var today = S.data.today;
  var cos = ix.cosByProject[pid] || [];
  var coByLine = {};
  var contractChanges = 0, pendingBudget = 0, pendingContract = 0;
  cos.forEach(function (o) {
    if (o.status === 'Approved') {
      if (o.lineItemId) coByLine[o.lineItemId] = (coByLine[o.lineItemId] || 0) + o.budgetChange;
      contractChanges += o.contractChange;
    } else {
      pendingBudget += o.budgetChange;
      pendingContract += o.contractChange;
    }
  });
  var all = (ix.linesByProject[pid] || []).filter(function (l) { return !l.hidden; }).sort(function (a, b) {
    return a.categoryOrder - b.categoryOrder || a.lineOrder - b.lineOrder || (a.name < b.name ? -1 : 1);
  });
  var rows = all.map(function (li) {
    var costs = (ix.costsByLine[li.id] || []).slice().sort(function (a, b) {
      return a.date < b.date ? 1 : a.date > b.date ? -1 : (a.created < b.created ? 1 : -1);
    });
    var r = { li: li, costs: costs, n: costs.length };
    r.ob = li.originalBudget;
    r.co = round2(coByLine[li.id] || 0);
    r.rb = round2(r.ob + r.co);
    r.actual = sum(costs, function (c) { return c.amount; });
    r.last = costs.length ? costs[0].date : '';
    if (li.done) r.forecast = r.actual;
    else r.forecast = Math.max(li.forecastOverride === '' ? r.rb : li.forecastOverride, r.actual);
    r.remaining = round2(r.forecast - r.actual);
    r.variance = round2(r.rb - r.forecast);
    r.status = li.done ? 'done' : (r.actual > r.rb + 0.005 && r.rb > 0) ? 'over'
      : (Math.abs(r.actual) > 0.005 && r.rb === 0) ? 'unbudgeted' : r.n ? 'progress' : 'none';
    return r;
  });
  var costRows = rows.filter(function (r) { return !r.li.fee; });
  var feeRows = rows.filter(function (r) { return r.li.fee; });
  function totals(list) {
    return {
      ob: sum(list, function (r) { return r.ob; }), co: sum(list, function (r) { return r.co; }),
      rb: sum(list, function (r) { return r.rb; }), actual: sum(list, function (r) { return r.actual; }),
      forecast: sum(list, function (r) { return r.forecast; }),
      remaining: sum(list, function (r) { return r.remaining; }),
      variance: sum(list, function (r) { return r.variance; })
    };
  }
  var cats = [], catMap = {};
  costRows.forEach(function (r) {
    var c = catMap[r.li.category];
    if (!c) { c = catMap[r.li.category] = { name: r.li.category, lines: [] }; cats.push(c); }
    c.lines.push(r);
  });
  cats.forEach(function (c) { c.t = totals(c.lines); });
  var cost = totals(costRows), fee = totals(feeRows);
  var prog = totals(costRows.filter(function (r) { return !r.li.excludeProgress; }));
  var origTotal = round2(cost.ob + fee.ob);
  var contractOrig = p.originalContract === '' ? origTotal : p.originalContract;
  var contract = round2(contractOrig + contractChanges);
  var profit = round2(contract - cost.forecast);

  var flags = [];
  costRows.concat(feeRows).forEach(function (r) {
    var where = r.li.category;
    if (r.status === 'over' || (r.li.done && r.actual > r.rb + 0.005 && r.rb > 0)) {
      flags.push({ kind: 'over', lineId: r.li.id, name: r.li.name, what: where + ' · ' + money(r.actual) + ' against a ' + money(r.rb) + ' budget', amount: r.actual - r.rb, label: money(r.actual - r.rb) + ' over' });
    } else if (r.status === 'unbudgeted' || (r.li.done && r.rb === 0 && r.actual > 0.005)) {
      flags.push({ kind: 'unbudgeted', lineId: r.li.id, name: r.li.name, what: where + ' · no budget set', amount: r.actual, label: money(r.actual) + ' unbudgeted' });
    } else if (r.status === 'progress' && !r.li.fee && r.last && daysBetween(r.last, today) > 60) {
      flags.push({ kind: 'stale', lineId: r.li.id, name: r.li.name, what: where + ' · no costs since ' + fmtDate(r.last) + '. Finished?', amount: 0, label: 'Check' });
    }
  });
  cats.forEach(function (c) {
    var overLines = c.lines.filter(function (r) { return r.variance < -0.005; }).length;
    if (c.t.forecast > c.t.rb + 0.005 && overLines > 1) {
      flags.push({ kind: 'trend', cat: c.name, name: c.name, what: 'Category trending over across ' + overLines + ' lines', amount: c.t.forecast - c.t.rb - 0.001, label: money(c.t.forecast - c.t.rb) + ' over' });
    }
  });
  flags.sort(function (a, b) { return b.amount - a.amount; });

  var byRow = {};
  rows.forEach(function (r) { byRow[r.li.id] = r; });
  return (ix.calc[pid] = {
    p: p, rows: rows, byRow: byRow, cats: cats, feeRows: feeRows, cost: cost, fee: fee,
    pct: prog.forecast > 0 ? Math.min(prog.actual / prog.forecast, 1) : 0,
    hasExcluded: costRows.some(function (r) { return r.li.excludeProgress && (r.rb || r.actual); }),
    used: cost.rb > 0 ? cost.actual / cost.rb : 0,
    totalBudget: round2(cost.rb + fee.rb), origTotal: origTotal,
    contractOrig: contractOrig, contractChanges: round2(contractChanges), contract: contract,
    pendingBudget: round2(pendingBudget), pendingContract: round2(pendingContract),
    profit: profit, margin: contract > 0 ? profit / contract : null,
    origMargin: contractOrig > 0 ? (contractOrig - cost.ob) / contractOrig : null,
    flags: flags, cos: cos
  });
}

/* =====================================================================
   4. Routing and the page shell
   ===================================================================== */
var NAV = [['overview', 'Overview', 'grid'], ['projects', 'Projects', 'folder'], ['vendors', 'Vendors', 'users'], ['settings', 'Settings', 'gear']];
var PTABS = [['dashboard', 'Dashboard'], ['budget', 'Budget'], ['costs', 'Costs'], ['changes', 'Change orders']];
var gs = window.google && google.script;

function parseRoute(hash) {
  var parts = String(hash || '').replace(/^#?\/?/, '').split('/');
  if (parts[0] === 'p' && parts[1]) return { view: 'project', id: parts[1], tab: parts[2] || 'dashboard' };
  if (parts[0] === 'v' && parts[1]) return { view: 'vendor', id: parts[1] };
  if (['projects', 'vendors', 'settings'].indexOf(parts[0]) >= 0) return { view: parts[0] };
  return { view: 'overview' };
}
function go(hash, replace) {
  S.route = parseRoute(hash);
  S.panel = null;
  try {
    if (gs && gs.history) gs.history[replace ? 'replace' : 'push'](null, null, hash);
  } catch (e) { /* history is a convenience only */ }
  render();
  window.scrollTo(0, 0);
}

function render() {
  if (!S.data) return;
  var active = document.activeElement;
  var keep = active && active.id && active.closest && active.closest('#main, #panelHost')
    ? { id: active.id, start: active.selectionStart, end: active.selectionEnd } : null;
  var r = S.route;
  if (r.view === 'project' && !project(r.id)) r = S.route = { view: 'projects' };
  if (r.view === 'vendor' && !vendor(r.id)) r = S.route = { view: 'vendors' };
  var navKey = r.view === 'project' ? 'projects' : r.view === 'vendor' ? 'vendors' : r.view;
  $('#sideNav').innerHTML = NAV.map(function (n) {
    return '<button class="side-item" data-go="' + n[0] + '"' + (navKey === n[0] ? ' aria-current="page"' : '') + '>' + icon(n[2]) + esc(n[1]) + '</button>';
  }).join('');
  $('#tabbar').innerHTML = NAV.map(function (n) {
    return '<button class="tab" data-go="' + n[0] + '"' + (navKey === n[0] ? ' aria-current="page"' : '') + '>' + icon(n[2]) + esc(n[1]) + '</button>';
  }).join('');
  var html = r.view === 'overview' ? viewOverview() : r.view === 'projects' ? viewProjects()
    : r.view === 'project' ? viewProject(r) : r.view === 'vendors' ? viewVendors()
    : r.view === 'vendor' ? viewVendor(r.id) : viewSettings();
  $('#main').innerHTML = '<div class="view">' + html + '</div>';
  $('#fab').hidden = !S.data.projects.some(function (p) { return !p.archived; });
  renderPanel();
  fillIcons();
  if (keep) {
    var el = document.getElementById(keep.id);
    if (el) {
      el.focus();
      try { if (keep.start !== null && el.type !== 'date') el.setSelectionRange(keep.start, keep.end); } catch (e) { /* not a text field */ }
    }
  }
  if (S.ui.focusCat) {
    var row = $('tr.cat[data-cat="' + cssEsc(S.ui.focusCat) + '"]');
    S.ui.focusCat = null;
    if (row) row.scrollIntoView({ block: 'center' });
  }
}
function cssEsc(s) { return String(s).replace(/["\\]/g, '\\$&'); }
function fillIcons() {
  $all('[data-icon]').forEach(function (el) { if (!el.firstChild) el.innerHTML = icon(el.getAttribute('data-icon')); });
}
function head(overline, title, sub, actions) {
  return '<div class="view-head"><div>' + (overline ? '<div class="overline">' + overline + '</div>' : '') +
    '<h1 class="display">' + esc(title) + '</h1>' + (sub ? '<p class="body-2">' + sub + '</p>' : '') + '</div>' +
    (actions ? '<div class="head-actions">' + actions + '</div>' : '') + '</div>';
}
function tile(label, value, sub, cls) {
  return '<div class="tile ' + (cls || '') + '"><span class="label">' + label + '</span><span class="numeral">' + value +
    '</span>' + (sub ? '<span class="sub">' + sub + '</span>' : '') + '</div>';
}
function emptyState(ic, title, text, btn) {
  return '<div class="card"><div class="empty"><span class="empty-icon">' + icon(ic) + '</span><h2 class="title">' + esc(title) +
    '</h2><p class="body-2">' + text + '</p>' + (btn || '') + '</div></div>';
}
function overUnder(v) {
  if (Math.abs(v) < 0.5) return { text: 'On budget', cls: '' };
  return v < 0 ? { text: money(-v) + ' over', cls: 'is-warn' } : { text: money(v) + ' under', cls: 'is-good' };
}
function statusChip(st) {
  var m = { done: ['done-chip', 'Done'], over: ['s-overdue', 'Over budget'], unbudgeted: ['s-due_soon', 'Unbudgeted'],
    progress: ['s-on_track', 'In progress'], none: ['s-unscheduled', 'Not started'] }[st];
  return '<span class="status ' + m[0] + '">' + m[1] + '</span>';
}
function typeChip(t) { return '<span class="tag tag-neutral" style="margin-top:0">' + esc(t) + '</span>'; }
function useBar(actual, budget) {
  var over = actual > budget + 0.005;
  var w = budget > 0 ? Math.min(actual / budget, 1) * 100 : (actual > 0 ? 100 : 0);
  return '<span class="bar-track"><span class="bar-fill' + (over ? ' is-over' : '') + '" style="width:' + w.toFixed(1) + '%"></span></span>';
}

/* =====================================================================
   5. Overview and Projects
   ===================================================================== */
function viewOverview() {
  var list = activeProjects();
  if (!S.data.projects.length) {
    return head('', 'Overview') + emptyState('folder', 'Start your first project',
      'Create a project to set a budget and start logging costs against it. Or load the demo job to look around first.',
      '<div><button class="btn btn-primary" data-act="new-project">' + icon('plus') + 'New project</button> ' +
      '<button class="btn btn-secondary" data-act="load-demo">Load demo project</button></div>');
  }
  var cs = list.map(function (p) { return calc(p.id); });
  cs.sort(function (a, b) {
    var la = a.rows.reduce(function (m, r) { return r.last > m ? r.last : m; }, a.p.created || '');
    var lb = b.rows.reduce(function (m, r) { return r.last > m ? r.last : m; }, b.p.created || '');
    return la < lb ? 1 : la > lb ? -1 : 0;
  });
  var tb = sum(cs, function (c) { return c.totalBudget; });
  var sp = sum(cs, function (c) { return c.cost.actual; });
  var vr = sum(cs, function (c) { return c.cost.variance; });
  var pr = sum(cs, function (c) { return c.profit; });
  var ou = overUnder(vr);
  var html = head('', 'Overview', list.length + (list.length === 1 ? ' active project' : ' active projects'),
    '<button class="btn btn-secondary btn-sm" data-act="new-project">' + icon('plus') + 'New project</button>');
  html += '<div class="tiles">' + tile('Total budget', money(tb), 'Including fees', 'is-forest') +
    tile('Spent to date', money(sp), tb ? pct(sp / Math.max(sum(cs, function (c) { return c.cost.rb; }), 1)) + ' of cost budget' : '') +
    tile('Projected over / under', ou.text, 'Across active projects', ou.cls) +
    tile('Projected profit', money(pr), 'Contract price less forecast cost', pr < 0 ? 'is-warn' : '') + '</div>';
  if (!list.length) return html + emptyState('folder', 'No active projects', 'Closed and archived projects are listed under Projects.');
  html += '<div class="card flush"><div class="gwrap"><table class="gt"><thead><tr><th>Project</th><th>Type</th><th>Complete</th>' +
    '<th class="num">Revised budget</th><th class="num">Spent</th><th class="num">Projected</th><th class="num">Margin</th></tr></thead><tbody>';
  cs.forEach(function (c) {
    html += '<tr class="line" data-go="p/' + c.p.id + '/dashboard"><td><div class="lname">' + esc(c.p.name) + '</div><div class="lsub">' +
      esc([c.p.location, c.p.status].filter(Boolean).join(' \u00b7 ')) + '</div></td><td>' + typeChip(c.p.type) + '</td>' +
      '<td><span class="usebar">' + useBar(c.pct, 1) + '</span> ' + pct(c.pct) + '</td>' +
      '<td class="num">' + money(c.cost.rb) + '</td><td class="num">' + money(c.cost.actual) + '</td>' +
      '<td class="num">' + varText(c.cost.variance) + '</td><td class="num">' + (c.margin === null ? '\u2014' : pct1(c.margin)) + '</td></tr>';
  });

      '<span class="num">' + money(k.t.actual) + '</span><span class="num muted">' + money(k.t.rb) + '</span><span class="num">' + varText(k.t.variance) + '</span></div>';
  });
  left += '</div><div class="card"><div class="card-head"><h2 class="title">Spend over time</h2><span class="label">Cumulative</span></div>' + spendChart(c) + '</div>';

  // Right column
  var right = '<div class="card list"><div class="card-head"><h2 class="title">Needs attention</h2><span class="label">' + (c.flags.length || '') + '</span></div>';
  if (!c.flags.length) right += '<div class="all-good">' + icon('check') + 'Everything is on budget.</div>';
  c.flags.slice(0, 8).forEach(function (f) {
    right += '<div class="flag-row" ' + (f.lineId ? 'data-act="open-line" data-id="' + f.lineId + '"' : 'data-act="open-cat" data-cat="' + esc(f.cat) + '"') + '><div class="grow"><div class="name">' +
      esc(f.name) + '</div><div class="what">' + esc(f.what) + '</div></div><span class="status ' + (f.kind === 'over' ? 's-overdue' : 's-due_soon') + '">' + esc(f.label) + '</span></div>';
  });
  if (c.flags.length > 8) right += '<p class="footnote">' + (c.flags.length - 8) + ' more on the Budget tab.</p>';

  var top = Object.keys(byVendor).map(function (id) { return { id: id, amt: byVendor[id] }; }).sort(function (a, b) { return b.amt - a.amt; }).slice(0, 5);

    });
    right += '</div>';

  return html + '<div class="grid-2"><div>' + left + '</div><div>' + right + '</div></div>';
}

function spendChart(c) {
  var byMonth = {};
  c.rows.forEach(function (r) {
    if (r.li.fee) return;
    r.costs.forEach(function (x) { var m = x.date.slice(0, 7); byMonth[m] = (byMonth[m] || 0) + x.amount; });
  });
  var keys = Object.keys(byMonth).sort();
  if (!keys.length) return '<p class="footnote">No costs logged yet.</p>';
  function addMonth(k, n) { var y = +k.slice(0, 4), m = +k.slice(5, 7) - 1 + n; y += Math.floor(m / 12); m = ((m % 12) + 12) % 12; return y + '-' + (m < 9 ? '0' : '') + (m + 1); }
  var months = [addMonth(keys[0], -1)], last = keys[keys.length - 1];
  while (months[months.length - 1] < last && months.length < 120) months.push(addMonth(months[months.length - 1], 1));
  var run = 0, pts = months.map(function (m) { run += byMonth[m] || 0; return run; });
  var top = Math.max(run, c.cost.rb, 1);
  var p10 = Math.pow(10, Math.floor(Math.log(top) / Math.LN10)), mant = top / p10;
  var yMax = (mant <= 1 ? 1 : mant <= 2 ? 2 : mant <= 2.5 ? 2.5 : mant <= 5 ? 5 : 10) * p10;
  var W = 640, H = 230, L = 50, R = 14, T = 12, B = 28;
  function x(i) { return L + (W - L - R) * (months.length === 1 ? 0 : i / (months.length - 1)); }
  function y(v) { return T + (H - T - B) * (1 - v / yMax); }
  var svg = '<svg class="odo-svg spark" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Cumulative spend by month">';
  for (var g = 0; g <= 4; g++) {
    var gv = yMax * g / 4;
    svg += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(gv) + '" y2="' + y(gv) + '"/><text class="axis" x="' + (L - 8) + '" y="' + (y(gv) + 4) + '" text-anchor="end">' + moneyShort(gv) + '</text>';
  }
  var step = Math.ceil(months.length / 8);
  months.forEach(function (m, i) {
    if (i % step === 0 || i === months.length - 1 && i % step > step / 2) svg += '<text class="axis" x="' + x(i) + '" y="' + (H - 8) + '" text-anchor="middle">' + MONTHS[+m.slice(5, 7) - 1] + (m.slice(5, 7) === '01' || i === 0 ? " '" + m.slice(2, 4) : '') + '</text>';
  });
  if (c.cost.rb > 0) svg += '<line class="est" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(c.cost.rb) + '" y2="' + y(c.cost.rb) + '"/>';
  svg += '<polyline class="line" points="' + pts.map(function (v, i) { return x(i).toFixed(1) + ',' + y(v).toFixed(1); }).join(' ') + '"/>';
  if (months.length <= 24) pts.forEach(function (v, i) { svg += '<circle class="dot" r="3.5" cx="' + x(i).toFixed(1) + '" cy="' + y(v).toFixed(1) + '"><title>' + MONTHS[+months[i].slice(5, 7) - 1] + ' ' + months[i].slice(0, 4) + ': ' + money(v) + '</title></circle>'; });
  return '<div class="chart">' + svg + '</svg><div class="chart-key"><span class="key-line"></span>Spent to date' +
    (c.cost.rb > 0 ? '<span class="key-dash"></span>Revised budget ' + money(c.cost.rb) : '') + '</div></div>';
}

/* ---------- saving each dialog ---------- */
function resolveLine(input, pid) {
  if (input.dataset.id && lineItem(input.dataset.id)) return input.dataset.id;
  var q = input.value.trim().toLowerCase();
  if (!q) return '';
  var opts = taOptions('line', pid), exact = opts.filter(function (o) { return o.label.toLowerCase() === q; });
  if (exact.length === 1) return exact[0].id;
  var hits = taFilter(opts, q);
  return hits.length === 1 ? hits[0].id : '';
}
function vendorOps(name) {
  var found = S.data.vendors.filter(function (v) { return v.name.trim().toLowerCase() === name.toLowerCase(); })[0];
  if (found) return { id: found.id, ops: found.archived ? [up('Vendors', { id: found.id, archived: false })] : [] };
  var v = { id: uid(), name: name, trade: '', phone: '', email: '', notes: '', archived: false };
  return { id: v.id, ops: [up('Vendors', v)] };
}
function buildCost(o) {
  // o: {projectId, lineItemId, amountText, vendorName, date, note, existing, force}
  var amount = parseAmount(o.amountText);
  if (!o.lineItemId) return { error: 'Choose a line item from the list.' };
  if (isNaN(amount) || amount === 0) return { error: 'Enter an amount, such as 1250.00.' };
  if (!o.vendorName) return { error: 'Enter the vendor who was paid.' };
  if (!isDate(o.date)) return { error: 'Enter a valid date.' };
  var v = vendorOps(o.vendorName);
  if (!o.force && S.data.costs.some(function (x) {
    return x.lineItemId === o.lineItemId && x.vendorId === v.id && x.amount === amount && x.date === o.date && (!o.existing || x.id !== o.existing.id);
  })) {
    return { error: 'This looks like a duplicate: the same vendor, amount and date are already on this line. <button type="button" class="btn-text" data-act="force-save">Save anyway</button>' };
  }
  var cost = { id: o.existing ? o.existing.id : uid(), projectId: o.projectId, lineItemId: o.lineItemId, vendorId: v.id, amount: amount, date: o.date,
    note: o.note || '', created: o.existing ? o.existing.created : new Date().toISOString(), deleted: false };
  return { cost: cost, ops: v.ops.concat([up('Costs', cost)]) };
}

/* =====================================================================
   11. Type-ahead (line item and vendor fields)
   ===================================================================== */
function taOptions(kind, pid) {
  if (kind === 'vendor') {
    return S.data.vendors.filter(function (v) { return !v.archived; }).sort(by('name')).map(function (v) { return { id: v.id, label: v.name, sub: v.trade }; });
  }
  if (!pid || !project(pid)) return [];
  return calc(pid).rows.map(function (r) { return { id: r.li.id, label: r.li.name, sub: r.li.category + (r.li.fee ? ' · Contractor fee' : '') }; });
}
function taFilter(opts, q) {
  var tokens = q.toLowerCase().split(/\s+/).filter(Boolean);
  var ql = q.trim().toLowerCase();
  // Best matches first: exact name, name starts with, name contains, then category matches.
  function rank(o) {
    var l = o.label.toLowerCase();
    return l === ql ? 0 : l.indexOf(ql) === 0 ? 1 : l.indexOf(ql) > 0 ? 2 : 3;
  }
  return opts.map(function (o, i) { return { o: o, i: i, r: ql ? rank(o) : 0 }; }).filter(function (x) {
    var hay = (x.o.label + ' ' + x.o.sub).toLowerCase();
    return tokens.every(function (t) { return hay.indexOf(t) >= 0; });
  }).sort(function (a, b) { return a.r - b.r || a.i - b.i; }).map(function (x) { return x.o; });
}
function taPid() {
  var d = S.dialog;
  if (d && d.type === 'cost') return d.cost ? d.cost.projectId : (val('cProject') || d.projectId);
  return S.route.id;
}
function taShow(ta) {
  var input = $('input', ta), list = $('.ta-list', ta), kind = ta.getAttribute('data-ta'), q = input.value.trim();
  var opts = taFilter(taOptions(kind, taPid()), q).slice(0, 50);
  var html = opts.map(function (o, i) {
    return '<div class="ta-opt' + (i === 0 && q ? ' is-active' : '') + '" data-id="' + o.id + '" data-label="' + esc(o.label) + '">' + esc(o.label) + (o.sub ? '<small>' + esc(o.sub) + '</small>' : '') + '</div>';
  }).join('');
  if (kind === 'vendor' && q && !opts.some(function (o) { return o.label.toLowerCase() === q.toLowerCase(); })) {
    html += '<div class="ta-opt is-new' + (opts.length ? '' : ' is-active') + '" data-new="1">Add “' + esc(q) + '” as a new vendor</div>';
  }
  if (kind === 'line' && !opts.length) html = '<div class="ta-opt" style="cursor:default;color:var(--text-2)">No line items match</div>';
  list.innerHTML = html;
  list.hidden = !html;
}
function taHide(ta) { var l = $('.ta-list', ta); if (l) l.hidden = true; }
function taChoose(ta, opt) {
  var input = $('input', ta);
  if (opt.getAttribute('data-id')) {
    input.value = opt.getAttribute('data-label');
    input.dataset.id = opt.getAttribute('data-id');
  }
  taHide(ta);
  if (input.id === 'cLine') { var a = $('#cAmount'); if (a && !a.value) a.focus(); }
}

function download(name, rows) {
  var csv = rows.map(function (r) {
    return r.map(function (v) {
      if (typeof v === 'number') return String(v);
      var s = String(v === null || v === undefined ? '' : v);
      if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
      return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }).join(',');
  }).join('\r\n');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
  a.download = name.replace(/[^\w.-]+/g, '-');
  document.body.appendChild(a);
  a.click();
  a.remove();
}

  'force-save': function () { SAVE.cost(S.dialog, { force: true }); },
  'new-co': function () { openDialog({ type: 'co', projectId: S.route.id }); },
  'edit-co': function (el) { var o = byId(S.data.changeOrders, el.getAttribute('data-id')); if (o) openDialog({ type: 'co', projectId: o.projectId, co: o }); },
  'delete-co': function () {
    var o = S.dialog.co;
    closeDialog();
    mutate([{ op: 'remove', tab: 'ChangeOrders', id: o.id }], 'Change order deleted', [up('ChangeOrders', JSON.parse(JSON.stringify(o)))]);
  },
  'clear-ledger': function () { var f = S.ui.ledger; f.q = f.cat = f.vendor = f.from = f.to = ''; render(); },
  'new-vendor': function () { openDialog({ type: 'vendor' }); },
  'edit-vendor': function (el) { openDialog({ type: 'vendor', vendor: vendor(el.getAttribute('data-id')) }); },
  'merge-vendor': function (el) { openDialog({ type: 'merge', id: el.getAttribute('data-id') }); },
  'tpl-type': function (el) { S.ui.tplType = el.getAttribute('data-type'); render(); },
  'tpl-remove': function (el) {
    var id = el.getAttribute('data-id');
    mutate([up('Templates', { id: id, active: false })], 'Removed from the template', [up('Templates', { id: id, active: true })]);
  },
  'tpl-import': function () {
    var type = S.ui.tplType, rows = templateRows(type), text = $('#tplPaste').value;
    var catOrder = {}, lineMax = {}, have = {}, maxCat = 0, ops = [], bad = 0;
    rows.forEach(function (t) {
      catOrder[t.category.toLowerCase()] = { order: t.categoryOrder, name: t.category };
      maxCat = Math.max(maxCat, t.categoryOrder);
      lineMax[t.category.toLowerCase()] = Math.max(lineMax[t.category.toLowerCase()] || 0, t.lineOrder);
      have[(t.category + '|' + t.lineItem).toLowerCase()] = 1;
    });
    text.split(/\r?\n/).forEach(function (raw) {
      if (!raw.trim()) return;
      var parts = raw.indexOf('\t') >= 0 ? raw.split('\t') : [raw.slice(0, raw.indexOf(',')), raw.slice(raw.indexOf(',') + 1)];
      var cat = (parts[0] || '').trim(), line = (parts[1] || '').trim();
      if (raw.indexOf('\t') < 0 && raw.indexOf(',') < 0 || !cat || !line) { bad++; return; }
      var key = cat.toLowerCase();
      if (have[(cat + '|' + line).toLowerCase()]) return;
      have[(cat + '|' + line).toLowerCase()] = 1;
      if (!catOrder[key]) catOrder[key] = { order: ++maxCat, name: cat };
      lineMax[key] = (lineMax[key] || 0) + 1;
      ops.push(up('Templates', { id: 'tpl_' + uid(), type: type, category: catOrder[key].name, categoryOrder: catOrder[key].order, lineItem: line, lineOrder: lineMax[key], fee: false, excludeProgress: false, active: true }));
    });
    if (bad) return toast(bad + (bad === 1 ? ' row needs' : ' rows need') + ' both a category and a line item, separated by a comma.');
    if (!ops.length) return toast('Nothing new to add.');
    mutate(ops, ops.length + (ops.length === 1 ? ' line' : ' lines') + ' added to the ' + type.toLowerCase() + ' template');
  },
  'export-budget': function () {
    var c = calc(S.route.id), rows = [['Category', 'Line item', 'Original budget', 'Changes', 'Revised budget', 'Actual', 'Forecast', 'Remaining', 'Variance', 'Status', 'Fee']];
    c.rows.forEach(function (r) { rows.push([r.li.category, r.li.name, r.ob, r.co, r.rb, r.actual, r.forecast, r.remaining, r.variance, r.status, r.li.fee ? 'yes' : '']); });
    download(c.p.name + '-budget.csv', rows);
  },
  'export-costs': function () {
    var c = calc(S.route.id), rows = [['Date', 'Category', 'Line item', 'Vendor', 'Note', 'Amount']];
    ledgerRows(c).forEach(function (x) { rows.push([x.date, x.category, x.line, x.vendor, x.note, x.amount]); });
    download(c.p.name + '-costs.csv', rows);
  },
  'export-all': function () {
    var rows = [['Project', 'Date', 'Category', 'Line item', 'Vendor', 'Note', 'Amount']];
    S.data.costs.slice().sort(by('date')).forEach(function (x) {
      var p = project(x.projectId), li = lineItem(x.lineItemId);
      rows.push([p ? p.name : '', x.date, li ? li.category : '', li ? li.name : '', vendorName(x.vendorId), x.note, x.amount]);
    });
    download('all-costs.csv', rows);
  },
  'close-dialog': closeDialog,
  'retry': function () { $('#main').innerHTML = '<div class="boot"><span class="spin"></span> Loading your projects\u2026</div>'; boot(); }
};

/* =====================================================================
   13. Events
   ===================================================================== */
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act], [data-go], [data-sort]');
  if (!el) return;
  var inner = e.target.closest('input, select, textarea, label, a, button');
  if (inner && inner !== el && el.contains(inner)) return;
  if (el.disabled) return;
  if (el.hasAttribute('data-go')) return go(el.getAttribute('data-go'));
  if (el.hasAttribute('data-sort')) {
    var f = S.ui.ledger, k = el.getAttribute('data-sort');
    if (f.sort === k) f.dir = -f.dir; else { f.sort = k; f.dir = k === 'date' || k === 'amount' ? -1 : 1; }
    return render();
  }
  var fn = ACT[el.getAttribute('data-act')];
  if (fn) fn(el);
});

document.addEventListener('submit', function (e) {
  e.preventDefault();
  if (e.target.id === 'dlg' && S.dialog) return SAVE[S.dialog.type](S.dialog, {});
  if (e.target.id === 'quickForm' && S.panel) {
    var res = buildCost({ projectId: S.route.id, lineItemId: S.panel.lineId, amountText: val('qAmount'), vendorName: val('qVendor'), date: S.data.today, note: '' });
    if (res.error) return toast(/duplicate/.test(res.error) ? 'That looks like a duplicate of an entry already on this line. Use Add cost to save it anyway.' : res.error);
    $('#qAmount').value = ''; $('#qVendor').value = '';
    mutate(res.ops, 'Cost added · ' + money2(res.cost.amount), [up('Costs', { id: res.cost.id, deleted: true })]);
    var a = $('#qAmount'); if (a) a.focus();
  }
});

document.addEventListener('input', function (e) {
  var t = e.target;
  var ta = t.closest('.ta');
  if (ta) { t.dataset.id = ''; return taShow(ta); }
  if (t.hasAttribute('data-ledger')) { S.ui.ledger[t.getAttribute('data-ledger')] = t.value; return render(); }
  if (t.hasAttribute('data-vendor-q')) { S.ui.vendorQ = t.value; return render(); }
});

document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.hasAttribute('data-budget')) {
    var li = lineItem(t.getAttribute('data-budget')), v = t.value.trim(), n = v === '' ? 0 : parseAmount(v);
    if (isNaN(n) || n < 0) { toast('Enter the budget as a positive number.'); return render(); }
    if (li && n !== li.originalBudget) mutate([up('LineItems', { id: li.id, originalBudget: n })]);
    return;
  }
  var ch = t.getAttribute('data-change');
  if (ch === 'show-archived') { S.ui.showArchived = t.checked; return render(); }
  if (ch === 'hide-empty') { S.ui.hideEmpty[S.route.id] = t.checked; return render(); }
  if (ch === 'cost-project') { var l = $('#cLine'); l.value = ''; l.dataset.id = ''; return; }
  if (t.type === 'radio' && t.closest('.choices')) {
    $all('.choice', t.closest('.choices')).forEach(function (c) { c.classList.toggle('is-on', $('input', c).checked); });
  }
});

document.addEventListener('focusin', function (e) {
  var ta = e.target.closest && e.target.closest('.ta');
  if (ta && e.target.tagName === 'INPUT') taShow(ta);
  if (e.target.classList && e.target.classList.contains('cell-in')) e.target.select();
});
document.addEventListener('focusout', function (e) {
  var ta = e.target.closest && e.target.closest('.ta');
  if (ta) setTimeout(function () { if (!ta.contains(document.activeElement)) taHide(ta); }, 120);
});
document.addEventListener('mousedown', function (e) {
  var opt = e.target.closest('.ta-opt');
  if (!opt) return;
  e.preventDefault();
  taChoose(opt.closest('.ta'), opt);
});

document.addEventListener('keydown', function (e) {
  var t = e.target, ta = t.closest && t.closest('.ta');
  if (ta) {
    var list = $('.ta-list', ta), opts = $all('.ta-opt[data-id], .ta-opt[data-new]', list), cur = $('.ta-opt.is-active', list), i = opts.indexOf(cur);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (list.hidden) return taShow(ta);
      if (!opts.length) return;
      var n = e.key === 'ArrowDown' ? Math.min(i + 1, opts.length - 1) : Math.max(i - 1, 0);
      if (cur) cur.classList.remove('is-active');
      opts[n].classList.add('is-active');
      opts[n].scrollIntoView({ block: 'nearest' });
      return;
    }
    if (e.key === 'Enter' && !list.hidden && cur) {
      // Enter picks the highlighted match. If the text already says exactly that (or is a new vendor), it also submits.
      var same = cur.getAttribute('data-new') || (cur.getAttribute('data-label') || '').toLowerCase() === t.value.trim().toLowerCase();
      if (!same) e.preventDefault();
      return taChoose(ta, cur);
    }
    if (e.key === 'Escape' && !list.hidden) { e.stopPropagation(); return taHide(ta); }
    if (e.key === 'Tab' && !list.hidden && cur && cur.getAttribute('data-id') && t.value.trim()) taChoose(ta, cur);
  }
  if (t.classList && t.classList.contains('cell-in') && e.key === 'Enter') {
    e.preventDefault();
    var cells = $all('.cell-in'), next = cells[cells.indexOf(t) + 1];
    if (next) next.focus(); else t.blur();
    return;
  }
  if (e.key === 'Escape') {
    if (S.dialog) return closeDialog();
    if (S.panel) return ACT['close-panel']();
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || S.dialog) return;
  if (e.key === 'n' || e.key === 'N') { if (!$('#fab').hidden) { e.preventDefault(); ACT['add-cost'](); } }
  else if (e.key === '/') { var q = $('#q'); if (q) { e.preventDefault(); q.focus(); } }
});

/* =====================================================================
   14. Start
   ===================================================================== */
function boot() {
  fillIcons();
  if (gs && gs.history && gs.history.setChangeHandler) {
    gs.history.setChangeHandler(function (ev) { S.route = parseRoute(ev.location.hash); S.panel = null; closeDialog(); render(); });
  }
  var start = new Promise(function (resolve) {
    if (gs && gs.url && gs.url.getLocation) gs.url.getLocation(function (loc) { resolve(loc.hash); });
    else resolve('');
  });
  Promise.all([start, server('apiLoad')]).then(function (r) {
    S.route = parseRoute(r[0]);
    setData(r[1]);
    render();
  }, function (e) {
    $('#main').innerHTML = '<div class="card" style="margin-top:40px"><div class="empty"><span class="empty-icon">' + icon('alert') + '</span><h2 class="title">The app could not load</h2><p class="body-2">' +
      esc(errText(e)) + '</p><button class="btn btn-primary" data-act="retry">Try again</button></div></div>';
  });
}
boot();
})();
</script>
